name: Reel diario

on:
  schedule:
    - cron: "23 12 * * *"   # 13:23 en España en invierno (14:23 en verano)
    - cron: "47 19 * * *"   # 20:47 en España en invierno (21:47 en verano)
  workflow_dispatch:
    inputs:
      publish:
        description: "¿Publicar en Instagram?"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar history.json y crear la release con el vídeo

concurrency: reel

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config
          pip install -r requirements.txt

      - name: Generar (y publicar) el reel
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          LANGUAGE: ${{ vars.LANGUAGE || 'es' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_HOST: ${{ vars.VIDEO_HOST || 'github' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Programado: publica solo si la variable AUTO_PUBLISH = true. Manual: según la casilla.
          PUBLISH: ${{ github.event_name == 'schedule' && vars.AUTO_PUBLISH || inputs.publish }}
        run: python main.py

      - name: Guardar el vídeo para revisarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/*.mp4
            output/caption.txt
          retention-days: 7

      - name: Guardar historial (evita repetir temas)
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "historial: nuevo reel" && git push

      - name: Renovar el token de Instagram (dura 60 días)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          NEW=$(python -c "from src.instagram import refresh_token; print(refresh_token())")
          echo "::add-mask::$NEW"
          GH_TOKEN=$GH_PAT gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
